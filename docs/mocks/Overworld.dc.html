<script type="text/x-dc" data-dc-script data-props='{"timeOfDay":{"editor":"enum","options":["day","golden hour","night"],"default":"day"},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() {
const t = this.props.timeOfDay ?? 'day';
const tints = { 'day': 'rgba(0, 0, 0, 0)', 'golden hour': 'rgba(242, 150, 60, 0.22)', 'night': 'rgba(28, 24, 80, 0.5)' };
const clocks = { 'day': '2:40 PM', 'golden hour': '6:20 PM', 'night': '9:10 PM' };
return { tint: tints[t] || tints.day, clock: clocks[t] || clocks.day };
}
}
</script>
